version: 1
validated_baseline:
  model_variant: super
  precision: fp8
  dflash: true
  note: Robot planning has been observed on this baseline; validate other cases on the active release before making quality claims.
defaults:
  max_tokens: 4096
  video_fps: 4.0
  thinking_token_budget: 512

cases:
  image_caption:
    title: Detailed image caption
    category: captioning
    media:
      type: image
      asset: robot_153.jpg
    prompt: Caption the image in detail.
    sampling:
      seed: 0
    output:
      kind: text
    review:
      - Describes the visible robot, workspace, and surrounding objects.

  video_caption:
    title: Detailed video caption
    category: captioning
    media:
      type: video
      asset: video_caption.mp4
    prompt: Describe the video in detail.
    output:
      kind: text
    review:
      - Describes the robot picking up and packing the white box.

  temporal_localization:
    title: Temporal action segments in seconds
    category: temporal_localization
    media:
      type: video
      asset: temporal_localization_1.mp4
    prompt: |-
      List all action segments in the video. For each event, return its numeric
      start and end time in seconds and a concise caption. List multiple events
      when applicable.
    output:
      kind: json_schema
      schema: temporal_events_seconds
    review:
      - Covers the cup pickup, popcorn dispensing, placement, and arm retraction.
      - Event intervals correspond to the visible sequence.

  event_timeline:
    title: Event timeline using timecodes
    category: temporal_localization
    media:
      type: video
      asset: temporal_localization_2.mp4
    prompt: |-
      Describe the notable events in the provided video. For each event, return
      start and end timecodes in mm:ss.ff format and a concise caption.
    output:
      kind: json_schema
      schema: temporal_events_timecodes
    review:
      - Covers the people leaving the room and carrying boxes down the hallway.
      - Event intervals correspond to the visible sequence.

  timestamp_query:
    title: Locate one event in time
    category: temporal_localization
    media:
      type: video
      asset: temporal_localization_2.mp4
    prompt: |-
      When is "A man in a white sweater walks out of a room carrying a box,
      closes the door behind him, walks on the floor, and turns left at the end
      near the wall." depicted in the video? Return start and end timecodes in
      mm:ss.ff format.
    output:
      kind: json_schema
      schema: timestamp_range
    review:
      - The interval contains the complete requested action.

  interval_question:
    title: Describe a specified time interval
    category: temporal_localization
    media:
      type: video
      asset: temporal_localization_2.mp4
    prompt: What happened between 00:05.64 and 00:17.49?
    output:
      kind: text
    review:
      - Describes people emerging from the room with boxes and entering the hallway.

  robotics_next_action:
    title: Predict a robot's next immediate action
    category: embodied_reasoning
    media:
      type: video
      asset: robotics_next_action.mp4
    prompt: What can be the next immediate action?
    reasoning:
      enabled: true
    output:
      kind: text
    review:
      - Predicts that the robot will place the charger or box into the cardboard box.

  drive_scene_next_action:
    title: Plan the next driving action
    category: embodied_reasoning
    media:
      type: video
      asset: drive_scene_next_action.mp4
    prompt: |-
      You are an autonomous vehicle planning system. The video depicts the
      observation from the vehicle's camera. Observe the critical objects in the
      environment and state the next action and driving trajectory.
    output:
      kind: text
    review:
      - Identifies navigation-critical agents and proposes a safe immediate action.

  robot_planning:
    title: Plan a flower placement task
    category: embodied_reasoning
    media:
      type: image
      asset: robot_planning.png
    prompt: |-
      The task is to put flower into the red bottle. Generate a plan consisting
      of subtasks for accomplish the task.
    sampling:
      seed: 0
    output:
      kind: text
    review:
      - Includes movement to the flower, grasp or pickup, movement to the bottle, and placement.

  assisted_task_next_action:
    title: Predict the next assisted-task action
    category: embodied_reasoning
    media:
      type: video
      asset: assisted_task_next_action.mp4
    prompt: |-
      This is the overall task that the agent is trying to complete: "The student
      exchanges the black ink cartridge of the printer." In the video, the agent
      is following one step of that task: "place old ink_cartridge." What should
      be the next action of the agent?
    reasoning:
      enabled: true
    output:
      kind: text
    review:
      - Proposes obtaining or installing the replacement black ink cartridge.

  common_sense_reasoning:
    title: Assess countertop support
    category: common_sense
    media:
      type: video
      asset: common_sense_reasoning.mp4
    prompt: Can the countertop support the weight of the juicers?
    reasoning:
      enabled: true
    output:
      kind: text
    review:
      - Answers the support question and cites visible evidence rather than an unrelated event.

  grounding_2d:
    title: Ground the load with a 2D box
    category: spatial_reasoning
    media:
      type: image
      asset: grounding_2d.png
    prompt: |-
      Locate the accurate bounding box of the load as a whole. Use coordinates
      normalized independently from 0 to 1000 on each image axis.
    sampling:
      seed: 0
    output:
      kind: json_schema
      schema: grounding_boxes
      visualization: boxes
    review:
      - The box encloses the complete load rather than one component or the full image.

  describe_anything:
    title: Describe marked image subjects
    category: spatial_reasoning
    media:
      type: image
      asset: describe_anything.png
    prompt: |-
      Caption the notable attributes in the provided image. List and describe all
      marked subjects with their subject ID, category, and detailed caption.
    sampling:
      seed: 0
    output:
      kind: json_schema
      schema: subject_captions
    review:
      - Covers every visibly marked subject with the matching ID and category.

  trajectory_2d:
    title: Move a bowl with a 2D gripper trajectory
    category: action_cot
    media:
      type: image
      asset: action_cot_trajectory.png
    prompt: |-
      You are given the task "Move the pink bowl to the right". Return the
      complete ordered 2D trajectory the end effector should follow, including
      approach, grasp, lift, transport to the right, placement, and retraction.
      Use coordinates normalized independently from 0 to 1000, with the origin
      at the top-left.
    reasoning:
      enabled: true
    sampling:
      temperature: 0.6
      top_p: 0.95
      presence_penalty: 0.0
    request_extensions:
      top_k: 20
      repetition_penalty: 1.0
    output:
      kind: json_schema
      schema: trajectory_points
      visualization: trajectory
    review:
      - Approaches and reaches the pink bowl.
      - Includes pickup or grasp and transports the bowl to the right.
      - Includes placement or release before retraction.

  flower_trajectory_2d:
    title: Place a flower with a 2D gripper trajectory
    category: action_cot
    media:
      type: image
      asset: robot_planning.png
    prompt: |-
      You are given the task "Put flower into the red bottle". Return the
      complete ordered 2D trajectory the end effector should follow, including
      approach, grasp, lift, transport to the bottle, placement, and retraction.
      Use coordinates normalized independently from 0 to 1000, with the origin
      at the top-left.
    reasoning:
      enabled: true
    sampling:
      temperature: 0.6
      top_p: 0.95
      presence_penalty: 0.0
    request_extensions:
      top_k: 20
      repetition_penalty: 1.0
    output:
      kind: json_schema
      schema: trajectory_points
      visualization: trajectory
    review:
      - Approaches and reaches the flower.
      - Includes pickup or grasp and transports the flower to the red bottle.
      - Includes placement into the bottle before retraction.

  driving_scene_action_cot:
    title: Identify critical objects for safe navigation
    category: action_cot
    media:
      type: video
      asset: action_cot_driving_scene.mp4
    prompt: |-
      The video depicts the observation from the vehicle's camera. Identify the
      objects in the scene that are critical for safe navigation and state the
      required driving response.
    reasoning:
      enabled: true
    sampling:
      temperature: 0.6
      top_p: 0.95
      presence_penalty: 0.0
    request_extensions:
      top_k: 20
      repetition_penalty: 1.0
    output:
      kind: text
    review:
      - Identifies the pedestrian as critical and recommends yielding or another safe response.

  physical_plausibility:
    title: Assess physical plausibility
    category: physical_reasoning
    media:
      type: video
      asset: physical_plausibility.mp4
    prompt: |-
      Is this video physically plausible under normal laws of physics, including
      object permanence, shape constancy, and continuous object trajectories?
      Base the answer on the visible events and ignore simulation-rendering
      quality. The rising wall is part of the experiment and should not be judged
      for plausibility. Answer (A) Possible or (B) Impossible.
    output:
      kind: text
    review:
      - Selects one of the requested alternatives based on the visible event.

  situation_understanding:
    title: Understand a cooking situation
    category: situation_understanding
    media:
      type: video
      asset: situation_understanding.mp4
    prompt: |-
      What is the person doing with the skillet? What will the person likely do
      next in this situation?
    output:
      kind: text
    review:
      - Describes the skillet action and a plausible immediate cooking step.
